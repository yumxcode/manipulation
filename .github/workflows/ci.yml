name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Offline tests
        run: pytest tests/test_offline.py tests/test_inspect_and_eval.py -v
      - name: Package build check
        run: |
          pip install build && python -m build --wheel
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names=z.namelist(); assert any('dobot_plug/apps/eval.py' in n for n in names), names; print('wheel ok', len(names), 'files')"
